    function App() {
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [ttsText, setTtsText] = useState('반려동물을 향한 감성 메시지를 GPU 기반 초고속 TTS 서비스로 합성합니다.');
      const [ttsVoice, setTtsVoice] = useState('girl');
      const [isGeneratingTts, setIsGeneratingTts] = useState(false);
      const [ttsSuccessMsg, setTtsSuccessMsg] = useState(null);
      const [pdfPage, setPdfPage] = useState(1);
      const [activePipelineStep, setActivePipelineStep] = useState(0);
      const [showLeaseEvidence, setShowLeaseEvidence] = useState(true);
      const [techFilter, setTechFilter] = useState('all');
      const [selectedTechIndex, setSelectedTechIndex] = useState(0);

      const [secureHandle, setSecureHandle] = useState('sample-a');
      const [secureNickname, setSecureNickname] = useState('주 사용 기기');
      const [secureAddNickname, setSecureAddNickname] = useState('보조 기기');
      const [secureState, setSecureState] = useState({
        status: 'loading',
        account: null,
        items: [],
        passkeys: [],
        events: [],
        message: null
      });
      const [isSecureBusy, setIsSecureBusy] = useState(false);

      const secureApi = async (path, options = {}) => {
        const response = await fetch(path, {
          ...options,
          credentials: 'include',
          headers: {
            ...(options.body ? { 'Content-Type': 'application/json' } : {}),
            ...(options.headers || {})
          }
        });
        const raw = await response.text();
        let data = {};
        try {
          data = raw ? JSON.parse(raw) : {};
        } catch {
          data = { error: raw || '서버 응답을 읽을 수 없습니다.' };
        }
        if (!response.ok) {
          const error = new Error(data.error || '요청을 처리하지 못했습니다.');
          error.status = response.status;
          error.payload = data;
          throw error;
        }
        return data;
      };

      const base64UrlToBytes = (value) => {
        const normalized = value.replace(/-/g, '+').replace(/_/g, '/');
        const padded = normalized + '='.repeat((4 - (normalized.length % 4)) % 4);
        const binary = atob(padded);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index);
        }
        return bytes;
      };

      const bytesToBase64Url = (value) => {
        const bytes = new Uint8Array(value);
        let binary = '';
        for (let index = 0; index < bytes.length; index += 1) {
          binary += String.fromCharCode(bytes[index]);
        }
        return btoa(binary)
          .replace(/\+/g, '-')
          .replace(/\//g, '_')
          .replace(/=+$/g, '');
      };

      const toCreationOptions = (options) => ({
        ...options,
        challenge: base64UrlToBytes(options.challenge),
        user: {
          ...options.user,
          id: base64UrlToBytes(options.user.id)
        },
        excludeCredentials: (options.excludeCredentials || []).map((credential) => ({
          ...credential,
          id: base64UrlToBytes(credential.id)
        }))
      });

      const toRequestOptions = (options) => ({
        ...options,
        challenge: base64UrlToBytes(options.challenge),
        allowCredentials: options.allowCredentials
          ? options.allowCredentials.map((credential) => ({
              ...credential,
              id: base64UrlToBytes(credential.id)
            }))
          : undefined
      });

      const serializeRegistrationCredential = (credential) => ({
        id: credential.id,
        rawId: bytesToBase64Url(credential.rawId),
        response: {
          clientDataJSON: bytesToBase64Url(credential.response.clientDataJSON),
          attestationObject: bytesToBase64Url(credential.response.attestationObject),
          transports: typeof credential.response.getTransports === 'function'
            ? credential.response.getTransports()
            : undefined
        },
        type: credential.type,
        clientExtensionResults: typeof credential.getClientExtensionResults === 'function'
          ? credential.getClientExtensionResults()
          : {},
        authenticatorAttachment: credential.authenticatorAttachment || undefined
      });

      const serializeAuthenticationCredential = (credential) => ({
        id: credential.id,
        rawId: bytesToBase64Url(credential.rawId),
        response: {
          clientDataJSON: bytesToBase64Url(credential.response.clientDataJSON),
          authenticatorData: bytesToBase64Url(credential.response.authenticatorData),
          signature: bytesToBase64Url(credential.response.signature),
          userHandle: credential.response.userHandle
            ? bytesToBase64Url(credential.response.userHandle)
            : null
        },
        type: credential.type,
        clientExtensionResults: typeof credential.getClientExtensionResults === 'function'
          ? credential.getClientExtensionResults()
          : {},
        authenticatorAttachment: credential.authenticatorAttachment || undefined
      });

      const secureErrorText = (error, fallback) => {
        if (error && error.name === 'NotAllowedError') {
          return '브라우저 또는 사용자가 패스키 요청을 취소했습니다. 저장된 내용은 변경되지 않았습니다.';
        }
        if (error && error.name === 'SecurityError') {
          return 'HTTPS 또는 localhost 보안 문맥에서만 패스키를 사용할 수 있습니다.';
        }
        return error && error.message ? error.message : fallback;
      };

      const lockedSecureState = (message = null) => ({
        status: 'locked',
        account: null,
        items: [],
        passkeys: [],
        events: [],
        message
      });

      const refreshSecureWorkspace = async () => {
        try {
          const session = await secureApi('/api/session');
          const [workspace, passkeys, events] = await Promise.all([
            secureApi('/api/private/items'),
            secureApi('/api/passkeys'),
            secureApi('/api/security/events')
          ]);
          setSecureState({
            status: 'authenticated',
            account: session.account,
            items: workspace.items || [],
            passkeys: passkeys.passkeys || [],
            events: events.events || [],
            message: null
          });
        } catch (error) {
          if (error.status === 401) {
            setSecureState(lockedSecureState());
          } else {
            setSecureState(lockedSecureState(
              secureErrorText(error, '보안 API가 아직 연결되지 않았습니다. 배포 환경변수를 확인해 주세요.')
            ));
          }
        }
      };

      const handleCancelRegistration = async (showMessage = true) => {
        try {
          await secureApi('/api/passkeys/register-cancel', {
            method: 'POST',
            body: '{}'
          });
        } catch {
          // A missing or expired challenge is already equivalent to cancellation.
        }
        if (showMessage) {
          setSecureState(lockedSecureState('등록을 취소했습니다. 계정이나 패스키는 저장되지 않았습니다.'));
        }
      };

      const beginPasskeyRegistration = async (adding = false) => {
        const handle = secureHandle.trim().toLowerCase();
        const nickname = (adding ? secureAddNickname : secureNickname).trim();

        if (!adding && !/^[a-z0-9][a-z0-9-_]{2,31}$/.test(handle)) {
          setSecureState(lockedSecureState('공개 별칭은 영문 소문자·숫자·하이픈·밑줄 3~32자로 입력해 주세요.'));
          return;
        }
        if (!nickname || nickname.length > 80) {
          setSecureState(lockedSecureState('패스키 이름을 1~80자로 입력해 주세요.'));
          return;
        }

        setIsSecureBusy(true);
        setSecureState((current) => ({ ...current, status: 'busy', message: null }));
